<!-- The dark band and the logo, as on the site. The logo is a 2x PNG of the starburst and the
     PARITY wordmark. Sent by our own sender (the Send Email hook) it is attached inline by
     Content-ID, so it shows without "download images". Sent by the Supabase SMTP fallback it is
     the hosted copy, and the alt text keeps the name readable on the band until images load. -->
<tr>
  <td class="p-band" bgcolor="#0d1220" align="left" style="background-color:#0d1220;border-radius:12px 12px 0 0;border-bottom:3px solid #1F4FBF;padding:22px 36px 20px 36px;">
    <a href="{{ .SiteURL }}" target="_blank" style="text-decoration:none;color:#f4f7ff;">
      <img src="[[ logo_src ]]" width="176" height="40" alt="PARITY" style="display:block;width:176px;height:40px;max-width:176px;border:0;outline:none;text-decoration:none;color:#f4f7ff;font-family:Georgia,'Times New Roman',serif;font-size:22px;line-height:40px;letter-spacing:6px;font-weight:700;">
    </a>
  </td>
</tr>
