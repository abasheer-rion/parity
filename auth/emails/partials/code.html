<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 8px 0;">
  <tr>
    <td class="p-codebox" align="center" style="background-color:#eef2fc;border:1px solid #d3ddf5;border-radius:10px;padding:20px 12px;">
      <span class="p-code" style="font-family:'SF Mono',SFMono-Regular,Menlo,Consolas,'Courier New',monospace;font-size:38px;line-height:44px;letter-spacing:10px;font-weight:700;color:#1F4FBF;-webkit-user-select:all;user-select:all;">{{ .Token }}</span>
    </td>
  </tr>
</table>
<p class="p-muted" style="margin:0 0 22px 0;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#5b5f72;">Tap or double-click the code to select it.</p>
