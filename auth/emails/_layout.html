<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>[[ title ]]</title>
<!--[if mso]>
<noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
<style>table,td,a,p,h1,span{font-family:Arial,Helvetica,sans-serif !important;}</style>
<![endif]-->
<style>
  :root { color-scheme: light dark; supported-color-schemes: light dark; }
  body { margin: 0; padding: 0; width: 100% !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table { border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
  img { border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
  a { color: #2f6bff; }
  @media (max-width: 600px) {
    .p-card { padding: 28px 22px !important; }
    .p-code { font-size: 26px !important; letter-spacing: 6px !important; }
  }
  /* Apple Mail, iOS Mail and Outlook for Mac follow the reader's dark mode. */
  @media (prefers-color-scheme: dark) {
    .p-bg { background-color: #10101a !important; }
    .p-card { background-color: #171721 !important; border-color: #2a2a3c !important; }
    .p-text { color: #ececf4 !important; }
    .p-muted { color: #9b9db2 !important; }
    .p-rule { border-color: #2a2a3c !important; }
    .p-codebox { background-color: #1f2440 !important; border-color: #2c3560 !important; }
    .p-code { color: #a9c3ff !important; }
    .p-link { color: #8fb0ff !important; }
  }
  /* Outlook.com and the Outlook apps mark dark mode with these attributes. */
  [data-ogsc] .p-text { color: #ececf4 !important; }
  [data-ogsc] .p-muted { color: #9b9db2 !important; }
  [data-ogsc] .p-code { color: #a9c3ff !important; }
  [data-ogsb] .p-bg { background-color: #10101a !important; }
  [data-ogsb] .p-card { background-color: #171721 !important; }
  [data-ogsb] .p-codebox { background-color: #1f2440 !important; }
</style>
</head>
<body class="p-bg" style="margin:0;padding:0;background-color:#f3f4f8;">
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#f3f4f8;opacity:0;">[[ preheader ]]&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;</div>
<table role="presentation" class="p-bg" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f4f8;">
  <tr>
    <td align="center" style="padding:32px 12px;">
      <!--[if mso]><table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
        [[> header ]]
        <tr>
          <td class="p-card" style="background-color:#ffffff;border:1px solid #e4e5ee;border-radius:12px;padding:36px 40px;">
            [[ content ]]
          </td>
        </tr>
        [[> footer ]]
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td>
  </tr>
</table>
</body>
</html>
