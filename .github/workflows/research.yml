# Nightly research run: fetch data, backtest every strategy, publish to Supabase.
# The report is also kept as a build artifact for 30 days.
#
# Secrets: PARITY_WRITER_DB_URL (insert-only database login), FRED_API_KEY (optional)
name: Research run

on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
    inputs:
      target_vol:
        description: "Annual volatility target, e.g. 0.15. Blank for none."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: pip install -e ".[publish]"
      - name: Ledger is intact
        run: parity ledger verify
      - name: Restore data cache
        uses: actions/cache@v6
        with:
          path: engine/data
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Fetch data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: parity fetch
      - name: Backtest
        env:
          TARGET_VOL: ${{ inputs.target_vol }}
        run: parity run ${TARGET_VOL:+--target-vol "$TARGET_VOL"}
      - uses: actions/upload-artifact@v7
        with:
          name: research-${{ github.run_id }}
          path: engine/output/latest.json
          retention-days: 30
      - name: Publish to Supabase
        env:
          PARITY_WRITER_DB_URL: ${{ secrets.PARITY_WRITER_DB_URL }}
        run: parity publish --allow-missing
