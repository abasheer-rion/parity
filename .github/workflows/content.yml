# Shareable clips (DEC-0035, GDE-0008): renders the sims into 9:16 and 1:1 MP4s, GIFs and a
# manifest of suggested captions, and keeps them as a workflow artifact for 30 days.
# Manual or weekly. It never posts anywhere: the owner downloads the artifact and posts.
name: Content clips

on:
  workflow_dispatch:
    inputs:
      scenes:
        description: "Scenes (comma separated) or all"
        default: all
  schedule:
    - cron: "0 7 * * 1"  # Mondays 07:00 UTC

permissions:
  contents: read

concurrency:
  group: content
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Restore data cache (prices)
        uses: actions/cache/restore@v6
        with:
          path: engine/data
          key: data-none
          restore-keys: data-
      - name: Bot Battle and world files from public prices
        working-directory: engine
        run: |
          pip install -q -e .
          parity fetch || true
          parity bots export
          parity world export
      - name: Latest strategy results (for the strategy race)
        continue-on-error: true  # the race scene is skipped when this file is missing
        env:
          SITE_DATA_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pip install -q "psycopg[binary]>=3.2"
          python3 scripts/export_site_data.py "$RUNNER_TEMP/site"
          cp "$RUNNER_TEMP/site/latest.json" engine/output/latest.json
      - name: Install ffmpeg and Chromium
        working-directory: web
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          npm ci
          npx playwright install --with-deps chromium
      - name: Render
        working-directory: web
        env:
          SCENES: ${{ inputs.scenes || 'all' }}
        run: |
          case "$SCENES" in *[!a-z,-]*) echo "scenes may only hold letters, commas and dashes"; exit 1;; esac
          npm run content -- --scenes "$SCENES" --ffmpeg ffmpeg
      - name: Summary
        run: |
          echo "### Clips" >> "$GITHUB_STEP_SUMMARY"
          ls -la content/out | tail -n +2 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: parity-clips-${{ github.run_number }}
          path: content/out/
          retention-days: 30
