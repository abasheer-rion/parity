# Builds Parity for Mac and Windows (DEC-0041, DEC-0049) and attaches the installers and the
# update files to a draft GitHub release. Run it from the Actions tab, or push a tag named
# desktop-v<version>. Publishing the release is what ships it: the public update feed at
# https://parity.endyland.com/desktop/updates/ serves the newest published desktop release
# (web/src/lib/desktopFeed.ts).
#
# Signing (desktop/electron-builder.config.js) happens only when these secrets exist; without
# them the build is ad hoc signed and not notarized, as before:
#   CSC_LINK           base64 of the Developer ID Application certificate and key (.p12)
#   CSC_KEY_PASSWORD   that .p12 file's password
#   APPLE_API_KEY      the App Store Connect API key file's contents (AuthKey_XXXX.p8)
#   APPLE_API_KEY_ID   that key's ID
#   APPLE_API_ISSUER   the issuer ID shown above the keys in App Store Connect
name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # Copies the public site only: research data, dev files and maps are refused.
      - run: node scripts/prepare-web.mjs
        working-directory: desktop
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-web
          path: desktop/build/web
          retention-days: 3

  mac:
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@v7
        with:
          name: desktop-web
          path: desktop/build/web
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      # The running app: log-in wall on a deep link, title bar dragging, offline copy, menu.
      - run: npm run test:app
        working-directory: desktop
      # The API key arrives as text; electron-builder wants a path to the .p8 file.
      - name: Signing credentials, when the secrets exist
        id: sign
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$CSC_LINK" ]; then echo "sign=true" >> "$GITHUB_OUTPUT"; else echo "sign=false" >> "$GITHUB_OUTPUT"; echo "No CSC_LINK secret: building ad hoc signed, not notarized."; fi
          if [ -n "$APPLE_API_KEY_P8" ]; then
            mkdir -p "$RUNNER_TEMP/apple"
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple/AuthKey.p8"
            echo "key_path=$RUNNER_TEMP/apple/AuthKey.p8" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the Mac disk images and update zips
        run: npm run build:mac
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.sign.outputs.sign }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ steps.sign.outputs.key_path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Remove the API key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/apple"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest-mac.yml

  windows:
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@v7
        with:
          name: desktop-web
          path: desktop/build/web
      - run: npm ci
        working-directory: desktop
      - name: Build the Windows installer (unsigned; electron-updater installs it as is)
        run: npm run build:win
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # The installer and its update files, not the unpacked app folder.
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: out
      - name: Attach the installers and update files to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          tag="desktop-v${version}"
          # Every name must match latest-mac.yml and latest.yml exactly, so none has a space.
          mapfile -t files < <(find out/desktop-mac out/desktop-windows -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \))
          for f in "${files[@]}"; do case "$f" in *" "*) echo "file name has a space: $f"; exit 1;; esac; done
          for need in latest-mac.yml latest.yml; do printf '%s\n' "${files[@]}" | grep -q "/$need$" || { echo "missing $need"; exit 1; }; done
          printf 'attaching %s\n' "${files[@]}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --draft --target "$GITHUB_SHA" --title "Parity desktop ${version}" --notes-file desktop/RELEASE_NOTES.md
          fi
