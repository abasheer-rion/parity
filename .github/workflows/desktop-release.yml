# Builds Parity for Mac and Windows (DEC-0041, DEC-0049) and attaches the installers and the
# update files to a GitHub release. Publishing the release is what ships it: the public update
# feed at https://paritytrading.app/desktop/updates/ serves the newest published desktop release
# (web/src/lib/desktopFeed.ts), and installed apps update themselves from it.
#
# Automatic releases: desktop-auto-release.yml creates a new tag desktop-v<next patch> on each
# merge to main that changes desktop/ (and weekly when web/ changed), then starts this workflow
# on that tag with publish=true. The version comes from the tag, so desktop/package.json is
# only the floor. A published release must be signed and notarized on the Mac and signed on
# Windows, or nothing is published. It is never marked as the repository's latest release.
#
# By hand: push a tag named desktop-v<version>, or run this from the Actions tab on a tag; the
# result is a draft release unless publish is ticked.
#
# Signing (desktop/electron-builder.config.js) happens only when these secrets exist; without
# them the build is ad hoc signed and not notarized, as before:
#   CSC_LINK           base64 of the Developer ID Application certificate and key (.p12)
#   CSC_KEY_PASSWORD   that .p12 file's password
#   APPLE_API_KEY      the App Store Connect API key file's contents (AuthKey_XXXX.p8)
#   APPLE_API_KEY_ID   that key's ID
#   APPLE_API_ISSUER   the issuer ID shown above the keys in App Store Connect
# A notarized build also has its disk images notarized and stapled (scripts/notarize-dmg.mjs),
# and the release stops if codesign, spctl or stapler does not accept the app and the images.
#
# Windows is signed with Azure Artifact Signing (account argus-signing, profile argus-public,
# publisher "Argus Vision, Inc.") when the repository variable AZURE_CLIENT_ID is set. The job
# logs in with GitHub OIDC through the desktop-release environment; there is no client secret.
# The variables: AZURE_CLIENT_ID (the parity-desktop-signing app), AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID. Without AZURE_CLIENT_ID the installer is built unsigned.
name: Desktop release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release (installed apps update to it), instead of leaving a draft"
        type: boolean
        default: false
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # Copies the public site only: research data, dev files and maps are refused.
      - run: node scripts/prepare-web.mjs
        working-directory: desktop
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-web
          path: desktop/build/web
          retention-days: 3

  mac:
    needs: web
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.build.outputs.signed }}
      notarized: ${{ steps.build.outputs.notarized }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@v7
        with:
          name: desktop-web
          path: desktop/build/web
      - run: npm ci
        working-directory: desktop
      # A run on a desktop-v<version> tag builds that version, whatever package.json says.
      - name: Take the version from the tag
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'desktop-v')
        shell: bash
        working-directory: desktop
        run: npm version "${GITHUB_REF_NAME#desktop-v}" --no-git-tag-version --allow-same-version
      - run: npm test
        working-directory: desktop
      # The running app: log-in wall on a deep link, title bar dragging, offline copy, menu,
      # a page that closes itself. A CI runner may show windows; a working Mac never does.
      - run: npm run test:app
        working-directory: desktop
        env:
          PARITY_VISIBLE: "1"
      # electron-builder reads an empty CSC_LINK as a path (the working folder) and fails, so
      # each signing variable is set only when its secret exists. The API key arrives as
      # text; electron-builder wants a path to the .p8 file.
      - name: Build the Mac disk images and update zips
        id: build
        working-directory: desktop
        env:
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SECRET_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          SECRET_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          SECRET_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$SECRET_CSC_LINK" ]; then
            export CSC_LINK="$SECRET_CSC_LINK" CSC_KEY_PASSWORD="$SECRET_CSC_KEY_PASSWORD"
            echo "Signing with the Developer ID certificate."
            if [ -n "$SECRET_APPLE_API_KEY" ] && [ -n "$SECRET_APPLE_API_KEY_ID" ] && [ -n "$SECRET_APPLE_API_ISSUER" ]; then
              mkdir -p "$RUNNER_TEMP/apple"
              printf '%s' "$SECRET_APPLE_API_KEY" > "$RUNNER_TEMP/apple/AuthKey.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/apple/AuthKey.p8" APPLE_API_KEY_ID="$SECRET_APPLE_API_KEY_ID" APPLE_API_ISSUER="$SECRET_APPLE_API_ISSUER"
              echo "Notarizing with the App Store Connect API key."
            else
              echo "No App Store Connect API key secrets: signed but not notarized."
            fi
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "No CSC_LINK secret: building ad hoc signed, not notarized."
          fi
          npm run build:mac
          if [ -n "$APPLE_API_KEY" ]; then
            node scripts/notarize-dmg.mjs dist
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          fi
          [ -n "$SECRET_CSC_LINK" ] && echo "signed=true" >> "$GITHUB_OUTPUT"
          true
      - name: Remove the API key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/apple"
      # A signed build must pass Apple's own checks before anything is attached to a release.
      - name: Verify the Mac signature and notarization
        if: steps.build.outputs.signed == 'true'
        working-directory: desktop
        env:
          NOTARIZED: ${{ steps.build.outputs.notarized }}
        run: |
          set -euo pipefail
          apps=$(find dist -maxdepth 2 -name '*.app' -type d)
          [ -n "$apps" ] || { echo "no app in dist"; exit 1; }
          for app in $apps; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            info=$(codesign -dv --verbose=2 "$app" 2>&1)
            printf '%s\n' "$info" | grep -E '^(Authority|TeamIdentifier|Identifier|CodeDirectory)'
            case "$info" in *"Authority=Developer ID Application: Argus Vision, Inc. (NK9MBSZRUF)"*) ;; *) echo "not signed by the Argus Vision Developer ID"; exit 1;; esac
            case "$info" in *"(runtime)"*) ;; *) echo "hardened runtime is off"; exit 1;; esac
            if [ "$NOTARIZED" = "true" ]; then
              spctl -a -t exec -vv "$app"
              xcrun stapler validate "$app"
            fi
          done
          for dmg in dist/*.dmg; do
            echo "== $dmg"
            codesign --verify --strict --verbose=2 "$dmg"
            if [ "$NOTARIZED" = "true" ]; then
              spctl -a -t open --context context:primary-signature -vv "$dmg"
              xcrun stapler validate "$dmg"
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest-mac.yml

  windows:
    needs: web
    runs-on: windows-latest
    # The environment is what the Azure federated credential trusts
    # (repo:abasheer-rion/parity:environment:desktop-release).
    environment: desktop-release
    permissions:
      id-token: write
      contents: write
    env:
      WIN_SIGN: ${{ vars.AZURE_CLIENT_ID != '' && '1' || '' }}
    outputs:
      signed: ${{ vars.AZURE_CLIENT_ID != '' && 'true' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@v7
        with:
          name: desktop-web
          path: desktop/build/web
      - run: npm ci
        working-directory: desktop
      # A run on a desktop-v<version> tag builds that version, whatever package.json says.
      - name: Take the version from the tag
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'desktop-v')
        shell: bash
        working-directory: desktop
        run: npm version "${GITHUB_REF_NAME#desktop-v}" --no-git-tag-version --allow-same-version
      - name: Log in to Azure for signing (OIDC, no secret)
        if: env.WIN_SIGN == '1'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The OIDC login can only mint new tokens for a few minutes, and the first file is signed
      # several minutes into the build. Fetch the signing token now; the Azure CLI keeps it
      # for about an hour, and the signing module reads it through the CLI.
      - name: Fetch the Artifact Signing token
        if: env.WIN_SIGN == '1'
        run: az account get-access-token --resource https://codesigning.azure.net --output none
      # electron-builder installs the signing module itself and carries on when that fails, so a
      # gallery hiccup broke the 0.2.4 build ("Invoke-TrustedSigning is not recognized").
      # Install a known version here, with retries, and stop if the command is missing.
      - name: Install the Artifact Signing module
        if: env.WIN_SIGN == '1'
        shell: pwsh
        run: |
          for ($i = 1; $i -le 4; $i++) {
            try { Install-Module -Name TrustedSigning -RequiredVersion 0.5.8 -Force -Scope CurrentUser -Repository PSGallery -ErrorAction Stop; break }
            catch { Write-Host "attempt $i failed: $_"; Start-Sleep -Seconds (15 * $i) }
          }
          Import-Module TrustedSigning -RequiredVersion 0.5.8 -ErrorAction Stop
          Get-Command Invoke-TrustedSigning -ErrorAction Stop | Format-Table Name, Version
      - name: Build the Windows installer (signed when Azure signing is set up)
        run: npm run build:win
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          PARITY_WIN_SIGN: ${{ env.WIN_SIGN }}
      - name: Verify the Windows signatures
        if: env.WIN_SIGN == '1'
        working-directory: desktop
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist\*.exe) + @(Get-Item dist\win-unpacked\Parity.exe)
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -FilePath $f.FullName
            Write-Host "$($f.Name): $($sig.Status) | $($sig.SignerCertificate.Subject) | timestamp: $($null -ne $sig.TimeStamperCertificate)"
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'CN="?Argus Vision, Inc\.' -or $null -eq $sig.TimeStamperCertificate) { $bad++ }
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if ($signtool) {
            foreach ($f in $files) { & $signtool.FullName verify /pa /v $f.FullName; if ($LASTEXITCODE -ne 0) { $bad++ } }
          } else { Write-Host "signtool not found; Get-AuthenticodeSignature checked above." }
          if ($bad -gt 0) { Write-Error "$bad signature check(s) failed"; exit 1 }
      # The installer and its update files, not the unpacked app folder.
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml

  # A Mac build that passed its checks is required. A Windows build that failed (including a
  # failed signature check) stops the release; one that was skipped is attached on a later run.
  # Publishing also needs a signed and notarized Mac build and a signed Windows build.
  release:
    needs: [mac, windows]
    if: ${{ !cancelled() && needs.mac.result == 'success' && needs.windows.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ inputs.publish == true && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: out
      - name: Refuse to publish an unsigned build
        if: env.PUBLISH == 'true'
        env:
          MAC_SIGNED: ${{ needs.mac.outputs.signed }}
          MAC_NOTARIZED: ${{ needs.mac.outputs.notarized }}
          WIN_RESULT: ${{ needs.windows.result }}
          WIN_SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          bad=0
          [ "$MAC_SIGNED" = "true" ] || { echo "::error::The Mac build is not signed."; bad=1; }
          [ "$MAC_NOTARIZED" = "true" ] || { echo "::error::The Mac build is not notarized."; bad=1; }
          [ "$WIN_RESULT" = "success" ] || { echo "::error::There is no Windows build in this run."; bad=1; }
          [ "$WIN_SIGNED" = "true" ] || { echo "::error::The Windows build is not signed."; bad=1; }
          case "$GITHUB_REF" in refs/tags/desktop-v*) ;; *) echo "::error::Only a run on a desktop-v tag can publish."; bad=1;; esac
          exit $bad
      - name: Attach the installers and update files to the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [[ "$GITHUB_REF_NAME" == desktop-v* ]]; then
            version="${GITHUB_REF_NAME#desktop-v}"
          else
            version=$(node -p "require('./desktop/package.json').version")
          fi
          tag="desktop-v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Every name must match latest-mac.yml and latest.yml exactly, so none has a space.
          mapfile -t files < <(find out -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \))
          for f in "${files[@]}"; do case "$f" in *" "*) echo "file name has a space: $f"; exit 1;; esac; done
          need=(latest-mac.yml)
          if [ -d out/desktop-windows ]; then need+=(latest.yml); else echo "::warning::No Windows build in this run; the release has the Mac files only."; fi
          for n in "${need[@]}"; do printf '%s\n' "${files[@]}" | grep -q "/$n$" || { echo "missing $n"; exit 1; }; done
          # The update files must name the version being released.
          for y in $(printf '%s\n' "${files[@]}" | grep -E '/latest(-mac)?\.yml$'); do grep -q "^version: ${version}$" "$y" || { echo "$y does not say version $version"; exit 1; }; done
          # The notes: the app's release notes, then what changed in the app since the last release.
          cp desktop/RELEASE_NOTES.md "$RUNNER_TEMP/notes.md"
          prev=$(git tag -l 'desktop-v*' --sort=-v:refname | grep -vx "$tag" | head -1 || true)
          if [ -n "$prev" ]; then
            { echo; echo "Changes since ${prev#desktop-v}:"; echo; git log --format='- %s' "$prev..$GITHUB_SHA" -- desktop web | head -40; } >> "$RUNNER_TEMP/notes.md"
          fi
          printf 'attaching %s\n' "${files[@]}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            if [ "$PUBLISH" = "true" ]; then gh release edit "$tag" --draft=false --latest=false; fi
          elif [ "$PUBLISH" = "true" ]; then
            gh release create "$tag" "${files[@]}" --verify-tag --latest=false --title "Parity desktop ${version}" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$tag" "${files[@]}" --draft --target "$GITHUB_SHA" --title "Parity desktop ${version}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
      # Installed apps read the feed, not GitHub: wait until it hands out the new version.
      - name: Check the update feed serves the new version
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for i in $(seq 1 40); do
            mac=$(curl -fsS "https://paritytrading.app/desktop/updates/latest-mac.yml?t=$i" | sed -n 's/^version: //p' || true)
            win=$(curl -fsS "https://paritytrading.app/desktop/updates/latest.yml?t=$i" | sed -n 's/^version: //p' || true)
            echo "feed: mac=$mac windows=$win"
            if [ "$mac" = "$VERSION" ] && [ "$win" = "$VERSION" ]; then echo "The feed serves $VERSION."; exit 0; fi
            sleep 30
          done
          echo "::error::The feed did not serve $VERSION within 20 minutes."
          exit 1
