# Applies new files in supabase/migrations/ to the hosted project when they reach main.
#
# Secrets: SUPABASE_DB_URL (owner connection string through the session pooler)
name: Database migrations

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.SUPABASE_DB_URL != '' }}
    steps:
      - name: Skip when Supabase is not connected yet
        if: env.HAS_SECRETS != 'true'
        run: echo "Supabase secrets are not set, nothing to migrate." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        if: env.HAS_SECRETS == 'true'
      - uses: supabase/setup-cli@v3
        if: env.HAS_SECRETS == 'true'
        with:
          version: latest
      - name: Link and push
        if: env.HAS_SECRETS == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
