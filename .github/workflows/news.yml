# Hourly news: fetch headlines from free sources whose terms allow it, look up a few
# "biggest day" explanations on GDELT, and keep everything in the Actions data cache.
# Commits nothing. The deploy workflow runs after this one and exports the News page JSON.
#
# Latency (DEC-0045): after the fetches, sources that fell behind are fetched once more
# after a pause, and every source's as-of time and fetch time go to the data_freshness
# table. Both steps need PARITY_WRITER_DB_URL and are skipped quietly without it.
#
# Secrets: PARITY_WRITER_DB_URL (insert-only database login, latency rows only),
# FRED_API_KEY (optional). Optional repository variable (not a secret): PARITY_CONTACT, an email or URL
# added to our user agent so BLS and the SEC, which ask bots to name themselves, can run.
# The keyed news APIs (Alpha Vantage, Finnhub, Marketaux) are personal use only on their
# free plans, so this shared job never uses them. See docs/reference/0013-news-sources-and-market-impact.md
name: News

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: pip install -e ".[publish]"
      - name: Restore data cache
        uses: actions/cache@v6
        with:
          path: engine/data
          key: data-${{ github.run_id }}-news
          restore-keys: data-
      - name: Prices, only if the cache is empty
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: test -f data/coverage.json || parity fetch
      - name: Fetch news
        env:
          PARITY_CONTACT: ${{ vars.PARITY_CONTACT }}
        run: parity news fetch
      - name: Fetch markets data (crypto, perps, ETFs, new filings; skips fresh sources)
        continue-on-error: true  # the Markets pages explain themselves when data is missing
        env:
          PARITY_CONTACT: ${{ vars.PARITY_CONTACT }}
        run: parity markets fetch
      - name: Fetch stale sources once more, after a pause (DEC-0045)
        continue-on-error: true  # a retry that fails is logged; the run goes on
        env:
          PARITY_CONTACT: ${{ vars.PARITY_CONTACT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PARITY_WRITER_DB_URL: ${{ secrets.PARITY_WRITER_DB_URL }}
        run: parity latency retry --publish --pipeline gha:news --backoff 30
      - name: Record how old each source is (DEC-0045)
        continue-on-error: true
        env:
          PARITY_WRITER_DB_URL: ${{ secrets.PARITY_WRITER_DB_URL }}
        run: parity latency freshness --publish >> "$GITHUB_STEP_SUMMARY"
      - name: Fill the news archive (older years once, then only the current year)
        continue-on-error: true  # the archive grows over many runs; one bad run is fine
        env:
          PARITY_CONTACT: ${{ vars.PARITY_CONTACT }}
        # Fed, ECB, BoJ year pages and our event catalog are re-read only for the current
        # year. GDELT gets one month (6 topic queries, 8 s apart) per run, newest first,
        # and stops at its first "too many requests". SEC 8-Ks run only with PARITY_CONTACT.
        run: parity news backfill --gdelt-limit 6
      - name: Explain a few record days (GDELT, polite pace)
        run: parity news records --explain 3 --limit 25 > /dev/null || true
      - name: Summary
        run: parity news list --limit 15 >> "$GITHUB_STEP_SUMMARY"
