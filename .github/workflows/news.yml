# Hourly news: fetch headlines from free sources whose terms allow it, look up a few
# "biggest day" explanations on GDELT, and keep everything in the Actions data cache.
# Commits nothing. The deploy workflow runs after this one and exports the News page JSON.
#
# No secrets. Optional repository variable (not a secret): PARITY_CONTACT, an email or URL
# added to our user agent so BLS and the SEC, which ask bots to name themselves, can run.
# The keyed news APIs (Alpha Vantage, Finnhub, Marketaux) are personal use only on their
# free plans, so this shared job never uses them. See docs/reference/0013-news-sources-and-market-impact.md
name: News

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: pip install -e .
      - name: Restore data cache
        uses: actions/cache@v6
        with:
          path: engine/data
          key: data-${{ github.run_id }}-news
          restore-keys: data-
      - name: Prices, only if the cache is empty
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: test -f data/coverage.json || parity fetch
      - name: Fetch news
        env:
          PARITY_CONTACT: ${{ vars.PARITY_CONTACT }}
        run: parity news fetch
      - name: Fetch markets data (crypto, perps, ETFs, new filings; skips fresh sources)
        continue-on-error: true  # the Markets pages explain themselves when data is missing
        env:
          PARITY_CONTACT: ${{ vars.PARITY_CONTACT }}
        run: parity markets fetch
      - name: Explain a few record days (GDELT, polite pace)
        run: parity news records --explain 3 --limit 25 > /dev/null || true
      - name: Summary
        run: parity news list --limit 15 >> "$GITHUB_STEP_SUMMARY"
