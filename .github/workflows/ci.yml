# Runs on every push and pull request. Must be green before merging.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Docs structure, links and wording
        run: python3 scripts/docs.py check ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref) || '' }}
      - name: Auth emails match their sources
        run: python3 auth/build.py --check
      - name: Ledger and registrations
        run: |
          pip install -q -e engine
          parity ledger verify
          parity registration check
      - name: Only the official-run workflow may change the ledger, and plans are frozen
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -q '^ledger/'; then
            echo "This pull request edits ledger/. Only the official-run workflow writes there."; exit 1
          fi
          for f in $(git diff --name-only --diff-filter=M "origin/${{ github.base_ref }}...HEAD" -- registrations/); do
            echo "$f was changed after being committed. Write a new registration instead."; exit 1
          done
      - name: Pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/commit_msg.py "$TITLE"
