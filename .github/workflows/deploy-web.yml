# Builds the dashboard and deploys it to Cloudflare Pages.
# main -> production, pull requests -> a preview URL posted in the job summary.
#
# Also redeploys after every research or official run, so the site carries the newest results.
# Published runs are copied into the site as files at deploy time. web/functions/ (deployed
# with the site because wrangler runs in web/) lets only signed-in people fetch /app/ and /data/.
# News: after each hourly News run, the newest headlines and market moves are exported from the
# shared data cache into dist/data/news (parity news export). Markets data (DEC-0018) is fetched
# by the same hourly job and exported into dist/data/markets (parity markets export).
# SEO (DEC-0023, DEC-0073): the build writes the public Learn, Ideas, Notes, Blog, News,
# changelog, announcements and status pages, the sitemaps and robots.txt. Every pull request
# fails when a public page's title, description, canonical link or JSON-LD is wrong
# (scripts/seo/meta_check.py). On a production deploy (main):
#   - before the build, when the GSC_VERIFICATION variable is empty, the Search Console META
#     token is fetched with the service account (scripts/seo/site_verify.py token) and written
#     into the front page. It never fails the deploy.
#   - after the deploy: IndexNow hears which public URLs changed, the sitemap is submitted to
#     Search Console (search_console.py --submit-only) and the site is verified there
#     (site_verify.py verify). All three may fail without failing the deploy.
# Each of those jobs has a kill switch (content/seo/automation.toml, or the SEO_AUTOMATION
# variable) and logs what it did to the job summary and the automation-log artifact.
# The site address always comes from web/src/lib/site.json.
# The changelog is built from git history, so the checkout fetches every commit and tag.
# Parity Terminal's files go into dist/data/terminal (parity terminal export), and Bot
# Battle's into dist/data/bots (parity bots export, DEC-0035).
# Latency (DEC-0045): after a production deploy, every source's row in data_freshness gets
# this deploy's time as its publish time, and the site files' own as-of times are recorded.
# Live data (DEC-0052, DEC-0056): on main, the parity-live worker (web/live/, the fan-out the
# site's /live/* routes talk to) is deployed first, when CLOUDFLARE_WORKERS_TOKEN is set. Without
# it the step is skipped and the worker keeps its last version (deploy it by hand, web/live/).
# Secrets: CLOUDFLARE_API_TOKEN (Pages edit only), CLOUDFLARE_ACCOUNT_ID, SUPABASE_DB_URL (read published runs),
# PARITY_WRITER_DB_URL (insert-only login, latency rows only), CLOUDFLARE_WORKERS_TOKEN (optional:
# Account, Workers Scripts Edit, for the parity-live worker), CLOUDFLARE_PURGE_TOKEN and
# CLOUDFLARE_ZONE_ID (optional: Zone, Cache Purge, for the purge after each deploy, DEC-0072),
# GSC_SERVICE_ACCOUNT_JSON (optional: the Search Console service account key, for the token,
# the sitemap submit and verification).
# Variables (optional): GSC_VERIFICATION, BING_VERIFICATION, GSC_OWNER_EMAILS (comma list of
# people made owners of the Search Console property), SEO_AUTOMATION (kill switch).
name: Deploy dashboard

on:
  push:
    branches: [main]
    paths: ["web/**", "docs/**", "catalog/events/**", "engine/src/parity/scenarios.py", "engine/src/parity/world.py", "engine/src/parity/terminal.py", "engine/src/parity/bots.py", "scripts/export_site_data.py", "scripts/export_front_strip.py", "scripts/bake_front_stats.py", "scripts/export_verify_prices.py", "scripts/seo/**", "scripts/newsroom/**", "content/newsroom/**", "content/updates/**", "content/seo/**", "scripts/updates/**", ".github/workflows/autopost.yml", "scripts/autopost/**", "content/newsroom/data/**", "catalog/algorithms/**", "engine/src/parity/news/**", "engine/src/parity/markets/**", "engine/src/parity/latency.py", ".github/workflows/deploy-web.yml"]
  pull_request:
    paths: ["web/**", "docs/**", "catalog/events/**", "engine/src/parity/scenarios.py", "engine/src/parity/world.py", "engine/src/parity/terminal.py", "engine/src/parity/bots.py", "scripts/export_site_data.py", "scripts/export_front_strip.py", "scripts/bake_front_stats.py", "scripts/export_verify_prices.py", "scripts/seo/**", "scripts/newsroom/**", "content/newsroom/**", "content/updates/**", "content/seo/**", "scripts/updates/**", ".github/workflows/autopost.yml", "scripts/autopost/**", "content/newsroom/data/**", "catalog/algorithms/**", "engine/src/parity/news/**", "engine/src/parity/markets/**", "engine/src/parity/latency.py", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Research run", "Official run", "News"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  deployments: write
  actions: read  # the newest status-auto artifact from the live probe (DEC-0073)

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      HAS_WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN != '' }}
      # A production deploy: main, or a run started by a workflow on main.
      IS_PROD: ${{ github.event_name != 'pull_request' && (github.event_name == 'workflow_run' || github.ref == 'refs/heads/main') }}
      # The SEO kill switch (scripts/seo/automation.py): "off", or a comma list of jobs to stop.
      SEO_AUTOMATION: ${{ vars.SEO_AUTOMATION }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the changelog reads git history and tags
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Search Console verification token (when GSC_VERIFICATION is empty)
        id: gsc_token
        if: env.IS_PROD == 'true' && vars.GSC_VERIFICATION == ''
        continue-on-error: true  # never fails the deploy; the build simply has no tag
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 ../scripts/seo/automation.py check gsc_verify || exit 0
          [ -n "$GSC_SERVICE_ACCOUNT_JSON" ] || { echo "no GSC_SERVICE_ACCOUNT_JSON, so no token"; exit 0; }
          pip install -q "google-auth>=2.30" "requests>=2.32" || exit 0
          token="$(python3 ../scripts/seo/site_verify.py token || true)"
          if [[ "$token" =~ ^[A-Za-z0-9_.-]{8,128}$ ]]; then echo "token=$token" >> "$GITHUB_OUTPUT"; else echo "no token this time"; fi
      - name: Collect status warnings for /status/ and the banner (DEC-0073)
        # Before the build, so build_public includes them. Carries the probe warning from the
        # newest live probe run (live-probe.yml) and reads the data health checks itself.
        continue-on-error: true  # without it the status page shows the manual entries only
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_DATA_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          UPDATES_STATUS_JSON: ${{ runner.temp }}/status.json
        run: |
          pip install -q "psycopg[binary]>=3.2"
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow live-probe.yml --limit 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$run" ]; then gh run download "$run" --repo "$GITHUB_REPOSITORY" -n status-auto -D "$RUNNER_TEMP/probe" || true; fi
          python3 ../scripts/updates/status.py --carry "$RUNNER_TEMP/probe/status-auto.json" --out "$UPDATES_STATUS_JSON"
      - run: npm run build
        env:
          # The warnings collected above (scripts/updates/build.py reads them).
          UPDATES_STATUS_JSON: ${{ runner.temp }}/status.json
          # Which sign-in buttons to show (auth/PROVIDERS.md). Public values, not secrets.
          VITE_AUTH_PROVIDERS: ${{ vars.AUTH_PROVIDERS }}
          VITE_AUTH_PASSKEYS: ${{ vars.AUTH_PASSKEYS }}
          # The bring-your-own-model assistant panel (DEC-0051). Off unless this is "on".
          VITE_AI_ASSISTANT: ${{ vars.AI_ASSISTANT }}
          # Search engine verification tokens (DEC-0023, DEC-0073). Public values: the variable,
          # else the token fetched above, else empty.
          GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION || steps.gsc_token.outputs.token }}
          BING_VERIFICATION: ${{ vars.BING_VERIFICATION }}
      # Titles, descriptions, canonical links, JSON-LD and keyword plan of every public page
      # (scripts/seo/meta_check.py, DEC-0073). Fails pull requests; on main it only reports, so
      # fresh results still deploy.
      - name: Check the public pages' titles, descriptions and structured data
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: python3 ../scripts/seo/meta_check.py --site-dir dist --json ../seo-meta.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Egress (REF-0028): runs already copied by an earlier deploy are kept here, and the
      # script downloads only runs whose fingerprint changed. Pull requests read main's copy.
      - name: Restore copied runs
        uses: actions/cache/restore@v6
        with:
          path: .site-data-cache
          key: site-data-none
          restore-keys: site-data-
      - name: Copy published runs into the site
        env:
          SITE_DATA_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SITE_DATA_CACHE: ${{ github.workspace }}/.site-data-cache
        run: |
          pip install "psycopg[binary]>=3.2"
          python3 ../scripts/export_site_data.py dist/data
      - name: Keep copied runs for the next deploy
        if: hashFiles('.site-data-cache/*.json') != ''
        continue-on-error: true  # an identical copy is already saved
        uses: actions/cache/save@v6
        with:
          path: .site-data-cache
          key: site-data-${{ hashFiles('.site-data-cache/*.json') }}
      - name: Restore data cache (prices and news)
        uses: actions/cache/restore@v6
        with:
          path: engine/data
          key: data-none
          restore-keys: data-
      - name: Scenario analogues and Sim World map (event studies over public prices)
        continue-on-error: true  # the page explains itself when this file is missing
        run: |
          pip install -q -e ../engine
          parity fetch
          parity scenario export --out dist/data/scenarios.json
          parity world export --out dist/data/world.json
          parity world stress --out dist/data/stress.json
          parity bots export --out dist/data
      - name: Copy news and market moves into the site
        run: |
          pip install -q -e ../engine
          parity news export dist/data
      - name: Copy markets data into the site (crypto, perps, ETFs, new filings)
        continue-on-error: true
        run: parity markets export dist/data
      - name: Parity Terminal data (every series the site may show, plus crypto)
        continue-on-error: true  # the terminal explains itself when its files are missing
        # After the markets step so CoinGecko crypto comes from dist/data/markets/crypto.json.
        run: parity terminal export --out dist/data --markets dist/data
      - name: Verify's daily prices for its fill checks (REF-0016), from the terminal export
        continue-on-error: true  # Verify says "cannot be checked" when this file is missing
        run: python3 ../scripts/export_verify_prices.py dist
      - name: Front page market strip (recent closes into stats.json, DEC-0021)
        continue-on-error: true  # the front page labels the strip as missing when this is absent
        run: python3 ../scripts/export_front_strip.py dist
      - name: Front page counts (stats.json written into index.html, DEC-0039)
        continue-on-error: true  # the page fetches /stats.json itself when this is skipped
        run: python3 ../scripts/bake_front_stats.py dist
      - name: Save the live SEO manifest (so IndexNow hears only what changed)
        if: env.IS_PROD == 'true'
        run: |
          origin="$(node -p "require('./src/lib/site.json').origin")"
          curl -fsS --max-time 20 "$origin/seo-manifest.json" -o ../seo-manifest.prev.json || echo "no live manifest yet"
      - name: Deploy the live fan-out worker (DEC-0056)
        if: github.event_name != 'pull_request' && env.HAS_WORKERS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/live
          command: deploy
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=parity-research --branch=${{ github.head_ref || (github.event_name == 'workflow_run' && 'main') || github.ref_name }} --commit-hash=${{ github.sha }}
      - name: Summary
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Purge the zone cache (DEC-0072)
        # Pages replaces its own edge copies on every deploy. This also clears anything the
        # zone's cache rules keep (pages kept up to 3 days), when the optional
        # CLOUDFLARE_PURGE_TOKEN (Zone, Cache Purge, paritytrading.app only) and
        # CLOUDFLARE_ZONE_ID are set. Without them the step says so and does nothing.
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$PURGE_TOKEN" ] || [ -z "$ZONE_ID" ]; then
            echo "Zone purge skipped: CLOUDFLARE_PURGE_TOKEN or CLOUDFLARE_ZONE_ID is not set. Pages still replaced its own copies." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $PURGE_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' > /dev/null
          echo "Zone cache purged." >> "$GITHUB_STEP_SUMMARY"
      - name: Record when the site published each source (DEC-0045)
        if: github.event_name != 'pull_request'
        continue-on-error: true  # the latency page shows the gap; the deploy itself is done
        env:
          PARITY_WRITER_DB_URL: ${{ secrets.PARITY_WRITER_DB_URL }}
        run: parity latency freshness --dist dist --stage published --publish
      # The three SEO jobs below check their own kill switch and log what they did (DEC-0073).
      - name: Tell search engines what changed (IndexNow)
        if: env.IS_PROD == 'true'
        continue-on-error: true
        run: python3 ../scripts/seo/indexnow.py --manifest dist/seo-manifest.json --previous ../seo-manifest.prev.json
      - name: Submit the sitemap to Google Search Console
        if: env.IS_PROD == 'true'
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URLS: ${{ vars.GSC_SITE_URLS }}
        run: |
          pip install -q "google-auth>=2.30" "requests>=2.32"
          python3 ../scripts/seo/search_console.py --submit-only --out ../seo-report/submit.json
      - name: Verify the site in Google Search Console (meta tag)
        if: env.IS_PROD == 'true'
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_OWNER_EMAILS: ${{ vars.GSC_OWNER_EMAILS }}
        run: python3 ../scripts/seo/site_verify.py verify
      - name: Keep the SEO automation log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: automation-log-deploy
          path: |
            web/automation-log/
            seo-meta.json
            seo-report/
          if-no-files-found: ignore
          retention-days: 30
