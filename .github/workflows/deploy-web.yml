# Builds the dashboard and deploys it to Cloudflare Pages.
# main -> production, pull requests -> a preview URL posted in the job summary.
#
# Also redeploys after every research or official run, so the site carries the newest results.
# Published runs are copied into the site as files at deploy time. web/functions/ (deployed
# with the site because wrangler runs in web/) lets only signed-in people fetch /app/ and /data/.
# News: after each hourly News run, the newest headlines and market moves are exported from the
# shared data cache into dist/data/news (parity news export). Markets data (DEC-0018) is fetched
# by the same hourly job and exported into dist/data/markets (parity markets export).
# Secrets: CLOUDFLARE_API_TOKEN (Pages edit only), CLOUDFLARE_ACCOUNT_ID, SUPABASE_DB_URL (read published runs)
name: Deploy dashboard

on:
  push:
    branches: [main]
    paths: ["web/**", "docs/**", "catalog/events/**", "engine/src/parity/scenarios.py", "engine/src/parity/world.py", "scripts/export_site_data.py", "engine/src/parity/news/**", "engine/src/parity/markets/**", ".github/workflows/deploy-web.yml"]
  pull_request:
    paths: ["web/**", "docs/**", "catalog/events/**", "engine/src/parity/scenarios.py", "engine/src/parity/world.py", "scripts/export_site_data.py", "engine/src/parity/news/**", "engine/src/parity/markets/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Research run", "Official run", "News"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Which sign-in buttons to show (auth/PROVIDERS.md). Public values, not secrets.
          VITE_AUTH_PROVIDERS: ${{ vars.AUTH_PROVIDERS }}
          VITE_AUTH_PASSKEYS: ${{ vars.AUTH_PASSKEYS }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Copy published runs into the site
        env:
          SITE_DATA_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pip install "psycopg[binary]>=3.2"
          python3 ../scripts/export_site_data.py dist/data
      - name: Restore data cache (prices and news)
        uses: actions/cache/restore@v6
        with:
          path: engine/data
          key: data-none
          restore-keys: data-
      - name: Scenario analogues and Sim World map (event studies over public prices)
        continue-on-error: true  # the page explains itself when this file is missing
        run: |
          pip install -q -e ../engine
          parity fetch
          parity scenario export --out dist/data/scenarios.json
          parity world export --out dist/data/world.json
      - name: Copy news and market moves into the site
        run: |
          pip install -q -e ../engine
          parity news export dist/data
      - name: Copy markets data into the site (crypto, perps, ETFs, new filings)
        continue-on-error: true
        run: parity markets export dist/data
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=parity-research --branch=${{ github.head_ref || (github.event_name == 'workflow_run' && 'main') || github.ref_name }} --commit-hash=${{ github.sha }}
      - name: Summary
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
