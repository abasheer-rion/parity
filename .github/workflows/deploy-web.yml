# Builds the dashboard and deploys it to Cloudflare Pages.
# main -> production, pull requests -> a preview URL posted in the job summary.
#
# Also redeploys after every research or official run, so the site carries the newest results.
# The site is behind Cloudflare Access; published runs are copied into it as files at deploy time.
# Secrets: CLOUDFLARE_API_TOKEN (Pages edit only), CLOUDFLARE_ACCOUNT_ID, SUPABASE_DB_URL (read published runs)
name: Deploy dashboard

on:
  push:
    branches: [main]
    paths: ["web/**", "docs/**", "catalog/events/**", "engine/src/parity/scenarios.py", "scripts/export_site_data.py", ".github/workflows/deploy-web.yml"]
  pull_request:
    paths: ["web/**", "docs/**", "catalog/events/**", "engine/src/parity/scenarios.py", "scripts/export_site_data.py", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Research run", "Official run"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # In-app sign-in stays off until the owner sets the repo variable APP_AUTH to "on"
          # (auth/README.md). Both values are public; neither is a secret.
          VITE_APP_AUTH: ${{ vars.APP_AUTH }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Copy published runs into the site
        env:
          SITE_DATA_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pip install "psycopg[binary]>=3.2"
          python3 ../scripts/export_site_data.py dist/data
      - name: Scenario analogues (event studies over public prices)
        continue-on-error: true  # the page explains itself when this file is missing
        run: |
          pip install -q -e ../engine
          parity fetch
          parity scenario export --out dist/data/scenarios.json
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=parity-research --branch=${{ github.head_ref || (github.event_name == 'workflow_run' && 'main') || github.ref_name }} --commit-hash=${{ github.sha }}
      - name: Summary
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
