<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'" />
    <title>Parity menu</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      html, body { height: 100%; overflow: hidden; background: transparent; }
      .scrim { position: fixed; inset: 0; background: rgb(2 3 5 / .5); opacity: 0; transition: opacity .14s; }
      body.open .scrim { opacity: 1; }

      /* The menu: a panel from the left edge. */
      .drawer { position: fixed; top: 0; bottom: 0; left: 0; width: 272px; display: flex; flex-direction: column; padding: 10px 8px; background: var(--panel); border-right: 1px solid var(--line-2); box-shadow: 18px 0 48px rgb(0 0 0 / .45); transform: translateX(-12px); opacity: 0; transition: transform .16s ease-out, opacity .16s; }
      body.open .drawer { transform: none; opacity: 1; }
      .drawer h2 { display: flex; align-items: center; gap: 8px; margin: 4px 8px 10px; font-size: 13px; font-weight: 600; color: var(--text); }
      .drawer h2 img { width: 18px; height: 18px; }
      .list { display: flex; flex-direction: column; gap: 1px; }
      .foot { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 1px; }
      .row { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 8px 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--text-2); text-align: left; cursor: default; }
      .row:hover, .row.sel { background: rgb(255 255 255 / .06); color: var(--text); }
      .row[aria-current="page"] { color: var(--text); background: var(--accent-soft); }
      .row[aria-current="page"] svg:first-child { color: var(--accent); }
      .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row kbd { border: 0; padding: 0; }
      .row .nw { display: none; align-items: center; justify-content: center; width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); }
      .row:hover .nw, .row.sel .nw { display: inline-flex; }
      .row:hover kbd, .row.sel kbd { display: none; }
      .nw:hover { color: var(--text); background: rgb(255 255 255 / .08); }
      .hint { margin: 8px 10px 2px; font-size: 11.5px; color: var(--muted); }

      /* The command palette, Open link and naming a workspace: a card near the top. */
      .card { position: fixed; left: 50%; top: 56px; width: min(620px, calc(100vw - 32px)); max-height: calc(100vh - 96px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 24px 72px rgb(0 0 0 / .55); transform: translate(-50%, -6px); opacity: 0; transition: transform .14s ease-out, opacity .14s; overflow: hidden; }
      body.open .card { transform: translate(-50%, 0); opacity: 1; }
      .field { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); color: var(--muted); }
      .field input { flex: 1; height: 48px; border: 0; outline: 0; background: transparent; color: var(--text); font: 500 15px/1 var(--font); }
      .field input::placeholder { color: var(--muted); }
      .results { overflow: auto; padding: 6px; }
      .group { margin: 8px 10px 4px; font-size: 11px; color: var(--muted); }
      .empty, .error { padding: 14px 16px; color: var(--muted); }
      .error { color: var(--bad); }
      .tips { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="scrim" id="scrim"></div>
    <nav class="drawer" id="drawer" aria-label="Sections" hidden>
      <h2><img src="/brand/2026-10-21-starburst/parity-mark.svg" alt="" />Parity</h2>
      <div class="list" id="sections"></div>
      <p class="hint" id="nwHint"></p>
      <div class="foot" id="foot"></div>
    </nav>
    <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="q" hidden>
      <label class="field"><span id="qIcon"></span><input id="q" autocomplete="off" spellcheck="false" /></label>
      <div class="results" id="results" role="listbox" aria-label="Results"></div>
      <div class="tips" id="tips"></div>
    </div>
    <script src="icons.js"></script>
    <script src="ui-overlay.js"></script>
  </body>
</html>
