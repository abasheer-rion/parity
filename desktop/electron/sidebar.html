<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'" />
    <title>Parity sections</title>
    <style>
      :root { color-scheme: dark; --bg: #050608; --line: rgb(255 255 255 / .07); --text: #f4f5f8; --muted: #8b8f9d; --accent: #3fb3f0; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--muted); overflow: hidden; user-select: none; -webkit-user-select: none; }
      body { font: 500 10.5px/1.2 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      nav { height: 100%; display: flex; flex-direction: column; align-items: stretch; gap: 2px; padding: 14px 6px 12px; border-right: 1px solid var(--line); -webkit-app-region: drag; }
      body.darwin nav { padding-top: 46px; }
      .mark { display: block; width: 26px; height: 26px; margin: 0 auto 12px; opacity: .95; }
      body.darwin .mark { display: none; }
      .list { display: flex; flex-direction: column; gap: 2px; }
      .foot { margin-top: auto; }
      button { -webkit-app-region: no-drag; position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; padding: 8px 2px 7px; border: 0; border-radius: 10px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
      button:hover { color: var(--text); background: rgb(255 255 255 / .05); }
      button[aria-current="page"] { color: var(--text); background: rgb(255 255 255 / .08); }
      button[aria-current="page"]::before { content: ""; position: absolute; left: -6px; top: 10px; bottom: 10px; width: 2px; border-radius: 2px; background: var(--accent); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
      svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <nav aria-label="Sections">
      <img class="mark" src="/brand/2026-10-21-starburst/parity-mark.svg" alt="" />
      <div class="list"></div>
      <div class="foot"></div>
    </nav>
    <script src="sidebar.js"></script>
  </body>
</html>
