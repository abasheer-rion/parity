<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Offline</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; }
      body { display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #11131a; color: #c9ccd6; border-bottom: 1px solid rgb(255 255 255 / .07); font: 500 12px/1 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-app-region: drag; }
      i { width: 7px; height: 7px; border-radius: 50%; background: #e0a43a; flex: none; }
      span { color: #8b8f9d; }
    </style>
  </head>
  <body>
    <i aria-hidden="true"></i>
    <b>Offline, showing saved copy</b>
    <span>The live site comes back by itself when the connection does.</span>
  </body>
</html>
