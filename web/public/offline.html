<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050608" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Offline · Parity</title>
    <style>
      html, body { margin: 0; height: 100%; background: #050608; color: #f4f5f8; color-scheme: dark; }
      body { font: 16px/1.6 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: grid; place-items: center; padding: 24px env(safe-area-inset-right) 24px env(safe-area-inset-left); box-sizing: border-box; }
      main { max-width: 420px; text-align: center; }
      img { width: 56px; height: 56px; display: block; margin: 0 auto 20px; }
      h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
      p { color: #a4a8b6; margin: 0 0 24px; }
      button { font: inherit; color: #f4f5f8; background: #151720; border: 1px solid rgb(255 255 255 / .12); border-radius: 10px; padding: 10px 18px; cursor: pointer; }
      button:focus-visible { outline: 2px solid #5cc2f5; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" width="56" height="56" />
      <h1>You are offline</h1>
      <p>This page has not been saved on this device yet. Pages you have opened before still work. Connect to the internet to load this one.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
