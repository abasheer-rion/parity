# Cloudflare Pages settings for the site (parity-research). The dashboard has no bindings
# or variables of its own, so this file is the only place they are set.
# LIVE: the live data fan-out (DEC-0052), a Durable Object in the parity-live worker
# (web/live/). It must be deployed before a Pages deploy that uses this binding.
name = "parity-research"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-21"

[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveHub"
script_name = "parity-live"
