# Who can sign a newsroom post (DEC-0053).
#
# team:  a real person on the Parity team. Name only. A bio or photo is added only when that
#        person supplies it, and then `supplied_by_author = true` must be set.
# house: a desk byline for work the team did together. Always named "Parity ...", never given
#        a face or a biography, and never presented as a person.
#
# Do not add made-up people. The build refuses bylines that break these rules.

[ayan]
name = "Ayan"
kind = "team"

[amanda]
name = "Amanda"
kind = "team"

[abanish]
name = "Abanish"
kind = "team"

[parity-research]
name = "Parity Research"
kind = "house"
about = "Write-ups of Parity's own research: what we tested, how we tested it and what we found, with sources."

[parity-markets-desk]
name = "Parity Markets Desk"
kind = "house"
about = "Short, sourced reports on market events and the data behind them."

[parity-editorial]
name = "Parity Editorial"
kind = "house"
about = "Company news, and opinion pieces from the Parity team. Opinion is always labelled as opinion."
